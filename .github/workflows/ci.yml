name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build and run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint check
        run: |
          npm run lint
          echo "Lint passed"
      - name: Run tests
        run: npm test
      - name: Build project
        run: |
          npm run build
          echo "Build complete"
      - name: Check README
        run: grep "project" README.md
      - name: Smoke check
        run: npm run smoke
      - name: Upload build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qoldau-workshop-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
